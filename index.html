<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131419">
<title>Spider — Blades in the Dark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <svg class="web" viewBox="0 0 200 200" aria-hidden="true">
      <g transform="translate(200 0)">
        <line x1="0" y1="0" x2="-200" y2="0"/><line x1="0" y1="0" x2="-170" y2="60"/>
        <line x1="0" y1="0" x2="-120" y2="110"/><line x1="0" y1="0" x2="-60" y2="150"/>
        <line x1="0" y1="0" x2="0" y2="200"/>
        <path d="M-30 0 A30 30 0 0 1 0 30"/><path d="M-70 0 A70 70 0 0 1 0 70"/>
        <path d="M-115 0 A115 115 0 0 1 0 115"/><path d="M-165 0 A165 165 0 0 1 0 165"/>
      </g>
    </svg>
    <div class="wordmark">
      <h1 id="pb-name">Spider</h1>
      <span class="eyebrow" id="pb-tagline">A Devious Mastermind</span>
    </div>
    <div class="title-meta">Blades in the Dark · Character Sheet</div>
    <div class="glance" id="glance"></div>
  </div>
</header>

<div class="wrap" id="app"></div>

<div class="wrap">
  <details class="sec">
    <summary><span class="dot"></span>Backup &amp; reset<span class="tw">▸</span></summary>
    <div class="sec-body">
      <p class="note">Your sheet saves automatically to this device. Clearing your browser data will erase it — export a backup file to be safe.</p>
      <div class="databar">
        <button id="btn-export">Export backup</button>
        <button id="btn-import">Import backup</button>
        <button id="btn-reset" class="danger">Reset sheet</button>
        <span class="saved" id="saved">Saved</span>
      </div>
      <input type="file" id="file-import" accept="application/json" style="display:none">
    </div>
  </details>
  <p class="foot">Tap a pip to fill to it · tap it again to clear. Everything saves as you go.</p>
</div>

<script src="data/core.js"></script>
<script src="data/playbooks.js"></script>
<script src="data/default-character.js"></script>
<script src="app.js"></script>
</body>
</html>
