<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131419">
<title>Spider — Blades in the Dark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#131419; --panel:#1B1D25; --panel-2:#22252F; --raised:#272b36;
  --line:#333845; --line-soft:#262a33;
  --text:#E9E6DD; --muted:#8B909C; --muted-2:#5c616d;
  --brass:#D6A93B; --brass-dim:#7a6326; --brass-glow:#f0c668;
  --oxblood:#C24A42; --oxblood-dim:#5a2520;
  --teal:#52B2A6; --teal-dim:#244e49;
  --display:"Oswald","Arial Narrow",sans-serif;
  --body:"Spectral",Georgia,"Times New Roman",serif;
  --r:10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--body); font-size:16px; line-height:1.5;
  padding:0 0 80px; -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:760px; margin:0 auto; padding:0 14px}

/* ---------- header ---------- */
header.top{
  position:relative; overflow:hidden;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#181a22,#131419);
  padding:18px 0 14px;
}
.web{position:absolute; top:-30px; right:-40px; width:220px; height:220px; opacity:.16; pointer-events:none}
.web path,.web line,.web circle{stroke:var(--brass); fill:none; stroke-width:1}
.wordmark{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.wordmark h1{
  font-family:var(--display); font-weight:700; letter-spacing:-.02em;
  font-size:clamp(40px,13vw,72px); line-height:.9; margin:0; text-transform:uppercase;
}
.wordmark .eyebrow{
  font-family:var(--display); font-weight:500; text-transform:uppercase;
  letter-spacing:.22em; font-size:11px; color:var(--brass);
}
.title-meta{color:var(--muted); font-size:12px; letter-spacing:.16em; text-transform:uppercase; font-family:var(--display); margin-top:2px}
.glance{
  display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;
}
.glance .chip{
  font-family:var(--display); text-transform:uppercase; letter-spacing:.08em; font-size:11px;
  background:var(--panel-2); border:1px solid var(--line); color:var(--muted);
  padding:5px 9px; border-radius:999px;
}
.glance .chip b{color:var(--text); font-weight:600; margin-left:5px}
.glance .chip.warn{border-color:var(--oxblood); color:var(--oxblood)}
.glance .chip.warn b{color:var(--oxblood)}

/* ---------- sections ---------- */
details.sec{
  border:1px solid var(--line); border-radius:var(--r); margin:14px 0;
  background:var(--panel); overflow:hidden;
}
details.sec>summary{
  list-style:none; cursor:pointer; user-select:none;
  display:flex; align-items:center; gap:10px;
  padding:13px 14px; font-family:var(--display); text-transform:uppercase;
  letter-spacing:.12em; font-size:14px; font-weight:600; color:var(--text);
}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .tw{margin-left:auto; color:var(--muted); transition:transform .18s ease; font-size:13px}
details.sec[open]>summary .tw{transform:rotate(90deg)}
details.sec>summary .dot{width:7px;height:7px;border-radius:50%;background:var(--brass);flex:none}
.sec-body{padding:4px 14px 16px}
.note{color:var(--muted); font-size:13px; font-style:italic; line-height:1.45}

/* ---------- form fields ---------- */
.field{margin:12px 0}
.field>label{
  display:block; font-family:var(--display); text-transform:uppercase; letter-spacing:.14em;
  font-size:11px; color:var(--muted); margin-bottom:5px;
}
input[type=text], textarea{
  width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
  border-radius:8px; padding:10px 11px; font-family:var(--body); font-size:16px;
}
input[type=text]:focus, textarea:focus{outline:2px solid var(--brass); outline-offset:1px; border-color:var(--brass)}
textarea{resize:vertical; min-height:90px; line-height:1.55}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
@media(max-width:430px){.row2{grid-template-columns:1fr}}

/* chips select */
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chips button{
  font-family:var(--display); text-transform:uppercase; letter-spacing:.06em; font-size:12px;
  background:var(--panel-2); border:1px solid var(--line); color:var(--muted);
  padding:7px 11px; border-radius:999px; cursor:pointer;
}
.chips button:hover{border-color:var(--brass-dim); color:var(--text)}
.chips button.on{background:var(--brass); border-color:var(--brass); color:#1a1408; font-weight:600}

/* ---------- pip tracks ---------- */
.track{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.pip{
  width:24px; height:24px; border:1.5px solid var(--line); background:transparent;
  border-radius:5px; cursor:pointer; flex:none; padding:0; transition:background .1s, border-color .1s;
}
.pip:hover{border-color:var(--muted)}
.pip.on{background:var(--brass); border-color:var(--brass)}
.pip.danger.on{background:var(--oxblood); border-color:var(--oxblood)}
.pip.teal.on{background:var(--teal); border-color:var(--teal)}
.pip.sm{width:16px;height:16px;border-radius:3px;border-width:1.5px}
.pip.round{border-radius:50%}
.tracklabel{font-family:var(--display); text-transform:uppercase; letter-spacing:.13em; font-size:11px; color:var(--muted); margin-bottom:6px; display:flex; justify-content:space-between; align-items:baseline}
.tracklabel .val{color:var(--text); font-weight:600; letter-spacing:0; font-size:13px}
.block{margin:14px 0}

/* stash grid */
.stash{display:grid; grid-template-columns:repeat(10,1fr); gap:5px; max-width:340px}
.stash .pip{width:100%; aspect-ratio:1; height:auto}

/* ---------- attributes ---------- */
.attr{border-top:1px solid var(--line-soft); padding:12px 0}
.attr:first-child{border-top:0}
.attr-head{display:flex; align-items:center; gap:10px; margin-bottom:4px}
.attr-head h3{
  font-family:var(--display); text-transform:uppercase; letter-spacing:.1em; font-size:14px;
  margin:0; font-weight:600;
}
.attr-head .rating{
  font-family:var(--display); font-size:11px; color:var(--brass); letter-spacing:.08em;
  border:1px solid var(--brass-dim); border-radius:999px; padding:2px 8px;
}
.attr-head .xp{margin-left:auto}
.action{display:flex; align-items:center; gap:10px; padding:6px 0}
.action .name{font-family:var(--display); text-transform:uppercase; letter-spacing:.08em; font-size:13px; min-width:96px; color:var(--text)}
.action .dots{display:flex; gap:7px; margin-left:auto}
.action .dot{
  width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line); background:transparent; cursor:pointer; padding:0;
}
.action .dot.on{background:var(--brass); border-color:var(--brass)}

/* ---------- abilities ---------- */
.abil{border-top:1px solid var(--line-soft); padding:12px 0; display:flex; gap:11px}
.abil:first-child{border-top:0}
.abil .toggle{
  flex:none; width:22px;height:22px;border-radius:50%;border:2px solid var(--line);
  background:transparent; cursor:pointer; margin-top:2px; padding:0; position:relative;
}
.abil .toggle.on{border-color:var(--brass)}
.abil .toggle.on::after{content:""; position:absolute; inset:3px; border-radius:50%; background:var(--brass)}
.abil .body h4{font-family:var(--display); text-transform:uppercase; letter-spacing:.06em; font-size:14px; margin:0 0 3px; color:var(--text)}
.abil.off .body h4{color:var(--muted)}
.abil .body p{margin:0; font-size:14px; color:var(--muted); line-height:1.5}
.abil .body p b{color:var(--text); font-weight:600}
.vet-input{margin-top:7px}

/* ---------- items ---------- */
.loadsel{display:flex; gap:6px; margin:6px 0 14px}
.loadsel button{
  flex:1; font-family:var(--display); text-transform:uppercase; letter-spacing:.06em; font-size:12px;
  background:var(--panel-2); border:1px solid var(--line); color:var(--muted);
  padding:9px 6px; border-radius:8px; cursor:pointer; line-height:1.2;
}
.loadsel button b{display:block; font-size:16px; color:var(--text)}
.loadsel button.on{background:var(--teal-dim); border-color:var(--teal); color:var(--text)}
.loadsel button.on b{color:var(--teal)}
.loadbar{
  display:flex; align-items:baseline; gap:8px; margin:2px 0 12px;
  font-family:var(--display); text-transform:uppercase; letter-spacing:.1em; font-size:12px; color:var(--muted);
}
.loadbar .big{font-size:20px; font-weight:600; color:var(--text); letter-spacing:0}
.loadbar.over .big{color:var(--oxblood)}
.itemsub{font-family:var(--display); text-transform:uppercase; letter-spacing:.14em; font-size:11px; color:var(--brass); margin:16px 0 6px; border-top:1px solid var(--line-soft); padding-top:12px}
.item{display:flex; align-items:center; gap:11px; padding:8px 0; border-top:1px solid var(--line-soft); cursor:pointer}
.item:first-of-type{border-top:0}
.item .box{
  flex:none; width:20px;height:20px;border-radius:4px;border:1.5px solid var(--line); background:transparent; position:relative;
}
.item.on .box{background:var(--brass); border-color:var(--brass)}
.item.on .box::after{content:"✓"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#1a1408; font-size:14px; font-weight:700}
.item .nm{flex:1; font-size:15px}
.item.on .nm{color:var(--text)}
.item.off .nm{color:var(--muted)}
.item .ld{font-family:var(--display); font-size:11px; color:var(--muted); letter-spacing:.06em; border:1px solid var(--line); border-radius:5px; padding:2px 7px}
.item.it-sub .nm{font-style:italic}

/* ---------- friends ---------- */
.friend{display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line-soft)}
.friend:first-child{border-top:0}
.friend .st{
  flex:none; font-family:var(--display); font-weight:700; font-size:16px; width:34px; height:34px;
  border-radius:8px; border:1.5px solid var(--line); background:var(--panel-2); color:var(--muted);
  cursor:pointer; line-height:1;
}
.friend .st.fr{border-color:var(--teal); color:var(--teal); background:var(--teal-dim)}
.friend .st.rv{border-color:var(--oxblood); color:var(--oxblood); background:var(--oxblood-dim)}
.friend .who b{color:var(--text)}
.friend .who span{color:var(--muted); font-size:14px}
.friend .tag{margin-left:auto; font-family:var(--display); text-transform:uppercase; font-size:10px; letter-spacing:.12em; color:var(--muted-2)}
.friend .st.fr ~ .tag{color:var(--teal)}

/* harm + clocks */
.harm-row{display:flex; align-items:center; gap:10px; margin:9px 0}
.harm-row .lvl{flex:none; width:54px; font-family:var(--display); font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); line-height:1.15}
.harm-row .lvl b{display:block; color:var(--oxblood); font-size:16px}
.harm-row input{flex:1}
.clocks-wrap{display:flex; flex-wrap:wrap; gap:18px; align-items:flex-start}
.clock{display:flex; flex-direction:column; align-items:center; gap:6px; width:110px}
.clock svg{width:90px; height:90px; cursor:pointer; touch-action:manipulation}
.clock .seg{stroke:var(--line); stroke-width:1.5; fill:var(--panel-2); cursor:pointer}
.clock .seg.on{fill:var(--teal)}
.clock .cl-name{font-family:var(--display); text-transform:uppercase; letter-spacing:.08em; font-size:11px; color:var(--muted); text-align:center}
.clock .cl-name input{background:transparent; border:0; border-bottom:1px solid var(--line); color:var(--text); text-align:center; font-family:var(--display); text-transform:uppercase; font-size:11px; letter-spacing:.08em; width:100%; padding:2px 0}
.clock .rm{background:none; border:0; color:var(--muted-2); font-size:11px; cursor:pointer; font-family:var(--display); text-transform:uppercase; letter-spacing:.1em}
.clock .rm:hover{color:var(--oxblood)}
.addclock{display:flex; gap:6px; margin-top:14px; align-items:center; flex-wrap:wrap}
.addclock .mini{font-family:var(--display); text-transform:uppercase; font-size:12px; letter-spacing:.06em; padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:var(--panel-2); color:var(--muted); cursor:pointer}
.addclock .mini:hover{border-color:var(--brass-dim); color:var(--text)}

/* reference */
.ref h4{font-family:var(--display); text-transform:uppercase; letter-spacing:.1em; font-size:12px; color:var(--brass); margin:14px 0 6px}
.ref h4:first-child{margin-top:2px}
.ref ul{margin:0 0 4px; padding-left:18px}
.ref li{font-size:14px; color:var(--text); margin:3px 0}
.ref li i{color:var(--muted)}
.ref .pg{display:grid; grid-template-columns:1fr 1fr; gap:4px 16px}
@media(max-width:430px){.ref .pg{grid-template-columns:1fr}}

/* footer / data */
.databar{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px}
.databar button{
  font-family:var(--display); text-transform:uppercase; letter-spacing:.08em; font-size:11px;
  background:var(--panel-2); border:1px solid var(--line); color:var(--muted);
  padding:8px 12px; border-radius:8px; cursor:pointer;
}
.databar button:hover{border-color:var(--brass-dim); color:var(--text)}
.databar button.danger:hover{border-color:var(--oxblood); color:var(--oxblood)}
.saved{font-family:var(--display); text-transform:uppercase; letter-spacing:.1em; font-size:10px; color:var(--teal); opacity:0; transition:opacity .3s; margin-left:4px; align-self:center}
.saved.show{opacity:1}
.foot{color:var(--muted-2); font-size:12px; text-align:center; margin:24px 0 8px; font-style:italic}

:focus-visible{outline:2px solid var(--brass); outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <svg class="web" viewBox="0 0 200 200" aria-hidden="true">
      <g transform="translate(200 0)">
        <line x1="0" y1="0" x2="-200" y2="0"/><line x1="0" y1="0" x2="-170" y2="60"/>
        <line x1="0" y1="0" x2="-120" y2="110"/><line x1="0" y1="0" x2="-60" y2="150"/>
        <line x1="0" y1="0" x2="0" y2="200"/>
        <path d="M-30 0 A30 30 0 0 1 0 30"/><path d="M-70 0 A70 70 0 0 1 0 70"/>
        <path d="M-115 0 A115 115 0 0 1 0 115"/><path d="M-165 0 A165 165 0 0 1 0 165"/>
      </g>
    </svg>
    <div class="wordmark">
      <h1>Spider</h1>
      <span class="eyebrow">A Devious Mastermind</span>
    </div>
    <div class="title-meta">Blades in the Dark · Character Sheet</div>
    <div class="glance" id="glance"></div>
  </div>
</header>

<div class="wrap" id="app"></div>

<div class="wrap">
  <details class="sec">
    <summary><span class="dot"></span>Backup &amp; reset<span class="tw">▸</span></summary>
    <div class="sec-body">
      <p class="note">Your sheet saves automatically to this device. Clearing your browser data will erase it — export a backup file to be safe.</p>
      <div class="databar">
        <button id="btn-export">Export backup</button>
        <button id="btn-import">Import backup</button>
        <button id="btn-reset" class="danger">Reset sheet</button>
        <span class="saved" id="saved">Saved</span>
      </div>
      <input type="file" id="file-import" accept="application/json" style="display:none">
    </div>
  </details>
  <p class="foot">Tap a pip to fill to it · tap it again to clear. Everything saves as you go.</p>
</div>

<script>
"use strict";
const KEY="bitd-spider-v2";

/* ---------------- static data ---------------- */
const HERITAGES=["Akoros","The Dagger Isles","Iruvia","Severos","Skovlan","Tycheros"];
const BACKGROUNDS=["Academic","Labor","Law","Trade","Military","Noble","Underworld"];
const VICES=["Faith","Gambling","Luxury","Obligation","Pleasure","Stupor","Weird"];
const TRAUMAS=["Cold","Haunted","Obsessed","Paranoid","Reckless","Soft","Unstable","Vicious"];

const ATTRS=[
  {name:"Insight", actions:["Hunt","Study","Survey","Tinker"]},
  {name:"Prowess", actions:["Finesse","Prowl","Skirmish","Wreck"]},
  {name:"Resolve", actions:["Attune","Command","Consort","Sway"]},
];

const ABILITIES=[
  {id:"foresight",name:"Foresight",html:"Two times per score you can <b>assist</b> a teammate without paying stress. Tell us how you prepared for this."},
  {id:"calculating",name:"Calculating",html:"Due to your careful planning, during <b>downtime</b>, you may give yourself or another crew member +1 downtime action."},
  {id:"connected",name:"Connected",html:"During downtime, you get <b>+1 result level</b> when you acquire an asset or reduce heat."},
  {id:"functioning_vice",name:"Functioning Vice",html:"When you indulge your vice, you may adjust the dice outcome by 1 or 2 (up or down). An ally who joins in your vice may do the same."},
  {id:"ghost_contract",name:"Ghost Contract",html:"When you shake on a deal, you and your partner — human or otherwise — both bear a mark of your oath. If either breaks the contract, they take level 3 harm, \"Cursed\"."},
  {id:"jail_bird",name:"Jail Bird",html:"When <b>incarcerated</b>, your wanted level counts as 1 less, your Tier as 1 more, and you gain +1 faction status with a faction you help on the inside (in addition to your incarceration roll)."},
  {id:"mastermind",name:"Mastermind",html:"You may expend your <b>special armor</b> to protect a teammate, or to <b>push yourself</b> when you gather information or work on a long-term project."},
  {id:"weaving_the_web",name:"Weaving the Web",html:"You gain +1d to Consort when you <b>gather information</b> on a target for a score. You get +1d to the <b>engagement roll</b> for that operation."},
  {id:"veteran",name:"Veteran",html:"Choose a special ability from another source.",veteran:true},
];

const ITEMS=[
  {id:"blade",name:"A Blade or Two",load:1},
  {id:"throwing",name:"Throwing Knives",load:1},
  {id:"pistol",name:"A Pistol",load:1},
  {id:"pistol2",name:"A 2nd Pistol",load:1},
  {id:"largeweap",name:"A Large Weapon",load:2},
  {id:"unusualweap",name:"An Unusual Weapon",load:1},
  {id:"armor",name:"Armor",load:2},
  {id:"heavyarmor",name:"+Heavy Armor",load:1},
  {id:"burglary",name:"Burglary Gear",load:1},
  {id:"climbing",name:"Climbing Gear",load:2},
  {id:"arcane",name:"Arcane Implements",load:1},
  {id:"documents",name:"Documents",load:1},
  {id:"subterfuge",name:"Subterfuge Supplies",load:1},
  {id:"demolition",name:"Demolition Tools",load:2},
  {id:"tinkering",name:"Tinkering Tools",load:1},
  {id:"lantern",name:"Lantern",load:1},
];
const PB_ITEMS=[
  {id:"cover",name:"Fine cover identity",load:0},
  {id:"whiskey",name:"Fine bottle of whiskey",load:0},
  {id:"blueprints",name:"Blueprints",load:0},
  {id:"slumber",name:"Vial of slumber essence",load:0},
  {id:"palmpistol",name:"Concealed palm pistol",load:1},
  {id:"spiritbane",name:"Spiritbane charm",load:0},
];
const FRIENDS=[
  {id:"salia",name:"Salia",desc:"an information broker"},
  {id:"augus",name:"Augus",desc:"a master architect"},
  {id:"jennah",name:"Jennah",desc:"a servant"},
  {id:"riven",name:"Riven",desc:"a chemist"},
  {id:"jeren",name:"Jeren",desc:"a bluecoat archivist"},
];
const LOADS={light:3,normal:5,heavy:6};

/* ---------------- state ---------------- */
function defaultState(){
  const s={
    name:"",alias:"",crew:"",look:"",purveyor:"",
    heritage:null,background:null,vice:null,
    stress:0, trauma:[], traumaCount:0,
    harm3:"",harm2a:"",harm2b:"",harm1a:"",harm1b:"",
    armor:false, armorHeavy:false, armorSpecial:false,
    healing:0, clocks:[],
    notes:"",
    stash:0, coin:0, playbookXp:0,
    actions:{}, attrXp:{Insight:0,Prowess:0,Resolve:0},
    abilities:{}, veteranName:"",
    items:{}, pbItems:{}, load:"normal",
    friends:{},
  };
  ATTRS.forEach(a=>a.actions.forEach(ac=>s.actions[ac]=0));
  ABILITIES.forEach(a=>s.abilities[a.id]=false);
  ITEMS.forEach(i=>s.items[i.id]=false);
  PB_ITEMS.forEach(i=>s.pbItems[i.id]=false);
  FRIENDS.forEach(f=>s.friends[f.id]=0);
  return s;
}
let state;
try{ state=Object.assign(defaultState(), JSON.parse(localStorage.getItem(KEY)||"{}")); }
catch(e){ state=defaultState(); }

let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{ localStorage.setItem(KEY, JSON.stringify(state)); flashSaved(); }catch(e){}
  },180);
}
function flashSaved(){ const el=document.getElementById("saved"); if(!el)return; el.classList.add("show"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),900); }

/* ---------------- helpers ---------------- */
function el(tag,cls,html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}

/* pip track bound to a numeric key */
function pipTrack(count,getVal,setVal,opts={}){
  const t=el("div","track");
  for(let i=1;i<=count;i++){
    const p=el("button","pip"+(opts.variant?" "+opts.variant:"")+(opts.sm?" sm":"")+(opts.round?" round":""));
    p.type="button"; p.setAttribute("aria-label",opts.label?opts.label+" "+i:"pip "+i);
    p.dataset.i=i;
    p.onclick=()=>{ const cur=getVal(); setVal(cur===i? i-1 : i); t._refresh(); rerenderLight(); };
    t.appendChild(p);
  }
  t._refresh=()=>{ const v=getVal(); [...t.children].forEach((c,idx)=>c.classList.toggle("on", idx<v)); };
  t._refresh();
  return t;
}
function labeledTrack(label,valFn,count,getVal,setVal,opts){
  const w=el("div","block");
  const head=el("div","tracklabel");
  head.appendChild(el("span",null,label));
  const v=el("span","val"); head.appendChild(v);
  const tr=pipTrack(count,getVal,setVal,opts);
  w.appendChild(head); w.appendChild(tr);
  w._refresh=()=>{ tr._refresh(); v.textContent=valFn(); };
  w._refresh();
  return w;
}

/* SVG clock */
function clockSVG(segments,getVal,setVal){
  const cx=45,cy=45,r=40, ns="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(ns,"svg"); svg.setAttribute("viewBox","0 0 90 90");
  function pt(a){ const rad=(a-90)*Math.PI/180; return [cx+r*Math.cos(rad), cy+r*Math.sin(rad)]; }
  const segs=[];
  for(let i=0;i<segments;i++){
    const a0=(360/segments)*i, a1=(360/segments)*(i+1);
    const [x0,y0]=pt(a0), [x1,y1]=pt(a1);
    const large=(a1-a0)>180?1:0;
    const path=document.createElementNS(ns,"path");
    path.setAttribute("d",`M${cx} ${cy} L${x0} ${y0} A${r} ${r} 0 ${large} 1 ${x1} ${y1} Z`);
    path.setAttribute("class","seg");
    path.dataset.i=i+1;
    path.onclick=()=>{ const cur=getVal(); setVal(cur===i+1? i : i+1); refresh(); save(); };
    svg.appendChild(path); segs.push(path);
  }
  function refresh(){ const v=getVal(); segs.forEach((s,idx)=>s.classList.toggle("on",idx<v)); }
  refresh(); svg._refresh=refresh;
  return svg;
}

(function(){

  const wrap=el("div","clocks-wrap");

  function render(){
    wrap.innerHTML="";

    wrap.appendChild(makeClock({name:"Healing",segments:4, fixed:true,
      get:()=>state.healing, set:v=>state.healing=v}));
    // custom
    state.clocks.forEach(c=>{

    });
  }
  function makeClock(o){
    const box=el("div","clock");
    let getV,setV,name;
    if(o.fixed){ getV=o.get; setV=o.set; }
    else { const c=o.clock; getV=()=>c.filled; setV=v=>c.filled=v; }
    box.appendChild(clockSVG(o.fixed?o.segments:o.clock.segments, getV, v=>{setV(v);save();}));
    const nm=el("div","cl-name");
    if(o.fixed){ nm.textContent=o.name+" (4)"; }
    else {
      const inp=el("input"); inp.type="text"; inp.value=o.clock.name; inp.placeholder="Project";
      inp.oninput=()=>{o.clock.name=inp.value;save();};
      nm.appendChild(inp);
    }
    box.appendChild(nm);
    if(!o.fixed){
      const rm=el("button","rm","Remove"); rm.type="button";
      rm.onclick=()=>{ state.clocks=state.clocks.filter(x=>x!==o.clock); save(); render(); };
      box.appendChild(rm);
    }
    return box;
  }
  [4,6,8].forEach(n=>{
    const btn=el("button","mini","+ "+n+"-clock"); btn.type="button";
    btn.onclick=()=>{ state.clocks.push({id:"c"+Date.now(),name:"",segments:n,filled:0}); save(); render(); };

})();

    row.onclick=()=>{ onMap[it.id]=!onMap[it.id]; row.classList.toggle("on"); row.classList.toggle("off"); save(); updLoad(); updateGlance(); };

    let n=0;

    bar.querySelector(".big").textContent=used;
    bar.querySelector("span:last-child").textContent="of "+lim;
    bar.classList.toggle("over",used>lim);

  window._updLoad=updLoad; window._computeLoad=computeLoad;

})();

function updateGlance(){
  const g=document.getElementById("glance");
  const nm=state.name||"Unnamed Spider";
  const used=window._computeLoad?window._computeLoad():0, lim=LOADS[state.load];
  g.innerHTML="";
  const chips=[
    {t:"Name",v:nm,warn:false},
    {t:"Stress",v:state.stress+"/9",warn:state.stress>=8},
    {t:"Coin",v:state.coin,warn:false},
    {t:"Load",v:used+"/"+lim,warn:used>lim},
  ];
  chips.forEach(c=>{
    const e=el("span","chip"+(c.warn?" warn":""),c.t+" <b>"+c.v+"</b>");
    g.appendChild(e);
  });
}

/* ---------------- backup ---------------- */
document.getElementById("btn-export").onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  const nm=(state.name||"spider").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"spider";
  a.href=URL.createObjectURL(blob); a.download="bitd-"+nm+".json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
document.getElementById("btn-import").onclick=()=>document.getElementById("file-import").click();
document.getElementById("file-import").onchange=(e)=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{ const data=JSON.parse(r.result); localStorage.setItem(KEY,JSON.stringify(Object.assign(defaultState(),data))); location.reload(); }catch(err){ alert("That file couldn't be read as a backup."); } };
  r.readAsText(f);
};
document.getElementById("btn-reset").onclick=()=>{
  if(confirm("Reset the whole sheet? This erases this character on this device. Export a backup first if you want to keep it.")){
    localStorage.removeItem(KEY); location.reload();
  }
};
